name: Python Application CI

# Kích hoạt workflow khi push hoặc pull request vào nhánh main
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Lấy mã nguồn từ repo
    - uses: actions/checkout@v4

    # 2. Cài đặt Python 3.10
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    # 3. Cài đặt dependencies
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install pytest # Cài thêm pytest vì chưa có trong requirements.txt

    # 4. Chạy kiểm thử (Tests)
    - name: Run Tests with Pytest
      run: |
        # Chạy tất cả các test trong thư mục test/
        pytest
